<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <div class="display">
            <p id="display__small">0</p>
            <p id="display__large">0</p>
        </div>
        <div class="button-box">
            <button class="btn button__ac">AC</button>
            <button class="btn button__del">DEL</button>
            <button class="btn button__fun">X</button>
            <button class="btn button__fun">/</button>
            <button class="btn">7</button>
            <button class="btn">8</button>
            <button class="btn">9</button>
            <button class="btn button__fun">-</button>
            <button class="btn">4</button>
            <button class="btn">5</button>
            <button class="btn">6</button>
            <button class="btn button__fun button__add">+</button>
            <button class="btn">1</button>
            <button class="btn">2</button>
            <button class="btn">3</button>
            <button class="btn">0</button>
            <button class="btn">.</button>
            <button class="btn button__eq">=</button>
        </div>

    </div>
    <script src="app.js"></script>

</body>
</html>
